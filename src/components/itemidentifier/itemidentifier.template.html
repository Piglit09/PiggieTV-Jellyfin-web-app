<div class="formDialogHeader">
    <button is="paper-icon-button-light" class="btnCancel autoSize" tabindex="-1" title="${ButtonBack}">
        <span class="material-icons arrow_back" aria-hidden="true"></span>
    </button>
    <h3 class="formDialogHeaderTitle">${Identify}</h3>
</div>

<div class="formDialogContent smoothScrollY">
    <div class="dialogContentInner dialog-content-centered">
        <form class="popupIdentifyForm identifySearchForm">

            <p>${HeaderIdentifyItemHelp}</p>
            <div class="padded-bottom fldPath hide">
                <div>${LabelPath}</div>
                <div class="txtPath fieldDescription"></div>
            </div>
            <div class="inputContainer">
                <input is="emby-input" type="text" id="txtLookupName" class="identifyField" data-lookup="Name" label="${LabelName}" />
            </div>
            <div class="fldLookupYear inputContainer">
                <input is="emby-input" type="number" id="txtLookupYear" class="identifyField" data-lookup="Year" pattern="[0-9]*" min="1800" label="${LabelYear}" />
            </div>
            <div class="identifyReadingFields"></div>

            <details class="identifyAdvancedFields">
                <summary>Advanced provider IDs</summary>
                <div class="identifyProviderIds"></div>
            </details>

            <div class="formDialogFooter">
                <button is="emby-button" type="submit" class="raised button-submit block formDialogFooterItem">
                    <span>${Search}</span>
                </button>
            </div>
        </form>

        <div class="identificationSearchResults hide">
            <h1>${SearchResults}</h1>
            <div class="identificationSearchStatus fieldDescription" style="margin:1em 0;"></div>
            <div class="identificationSearchResultList itemsContainer vertical-wrap"></div>
        </div>

        <form class="identifyOptionsForm hide">
            <div class="selectedSearchResult"></div>
            <div class="identifyApplyStatus fieldDescription"></div>
            <div class="readingMetadataPreviewActions hide">
                <button is="emby-button" type="button" class="raised btnSelectSafeChanges">Select all safe changes</button>
                <button is="emby-button" type="button" class="raised btnClearMetadataSelections">Clear selections</button>
            </div>
            <div class="readingMetadataComparison"></div>

            <div class="formDialogFooter">
                <button is="emby-button" type="button" class="raised btnCancel formDialogFooterItem">
                    <span>${ButtonCancel}</span>
                </button>
                <button is="emby-button" type="submit" class="raised button-submit block btnSubmit formDialogFooterItem">
                    <span>Apply Metadata</span>
                </button>
            </div>
        </form>
    </div>
</div>
