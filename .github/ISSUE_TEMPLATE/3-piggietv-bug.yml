name: PiggieTV Bug
description: Report a reproducible PiggieTV frontend or companion-plugin problem
labels:
  - bug
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Reports and attachments are public.
      options:
        - label: I removed API keys, passwords, tokens, authorization headers, private server addresses, user IDs, local filesystem paths, and private media names.
          required: true
        - label: I searched existing issues for this problem.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the PiggieTV route...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: PiggieTV route
      description: Include only the hash route. Remove private IDs and query values.
      placeholder: "#/movies?view=genre&genre=Example"
  - type: textarea
    id: provenance
    attributes:
      label: Sanitized build information
      description: Paste the compact build-information line from the PiggieTV dashboard. Review it before submitting.
      render: text
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client class
      options:
        - Desktop browser
        - Mobile browser
        - Tablet browser
        - Android TV or Fire TV
        - Other TV or embedded browser
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics and screenshots
      description: Use PiggieTV's sanitized export. Do not paste raw network requests, request headers, server logs, or unreviewed browser storage.
  - type: textarea
    id: regression
    attributes:
      label: Last known working build
      description: Optional. Include the compact frontend build ID or commit, not a private deployment URL.
