<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="pip">
  <defs>
    <linearGradient id="ptvGradient" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.48" stop-color="#8c00f3"/>
      <stop offset="1" stop-color="#f300b1"/>
    </linearGradient>
    <filter id="ptvGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.05  0 0 0 0 1  0 0 0 .55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#ptvGradient)" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" filter="url(#ptvGlow)">
    <rect x="3.5" y="5" width="17" height="14" rx="2.5"/>
        <rect x="12.5" y="11.5" width="5.5" height="4" rx="1" fill="url(#ptvGradient)" stroke="none"/>
  </g>
</svg>
