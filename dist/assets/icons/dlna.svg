<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">

<defs>
  <linearGradient id="ptv-stroke" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00d8ff"/>
    <stop offset="0.48" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#ff2bd6"/>
  </linearGradient>
  <linearGradient id="ptv-fill" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00d8ff" stop-opacity=".95"/>
    <stop offset=".55" stop-color="#8b5cf6" stop-opacity=".90"/>
    <stop offset="1" stop-color="#ff2bd6" stop-opacity=".95"/>
  </linearGradient>
  <filter id="ptv-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.15" result="blur"/>
    <feColorMatrix in="blur" type="matrix"
      values="0 0 0 0 0.00  0 0 0 0 0.78  0 0 0 0 1.00  0 0 0 .70 0" result="blueGlow"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation=".28" result="soft"/>
    <feMerge>
      <feMergeNode in="blueGlow"/>
      <feMergeNode in="soft"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

  <g filter="url(#ptv-glow)" stroke="url(#ptv-stroke)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="16.5" r="1.7" fill="url(#ptv-fill)" stroke="none"/>
    <path d="M6 12.3c3.1 0 5.7 2.6 5.7 5.7"/>
    <path d="M6 8.2c5.4 0 9.8 4.4 9.8 9.8"/>
    <path d="M6 4.2c7.7 0 13.8 6.1 13.8 13.8"/>
  </g>
</svg>
